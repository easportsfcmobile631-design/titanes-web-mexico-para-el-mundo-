<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Tienda Web - 900 visibles</title><style>body{background:#000;color:gold;font-family:Arial;text-align:center;margin:0;padding:8px}.grid{display:flex;flex-wrap:wrap;justify-content:center}.card{width:46%;margin:5px;background:#111;border:2px solid gold;border-radius:14px;padding:8px;box-sizing:border-box}.foto{width:100%;height:135px;background:#222;border-radius:12px;border:1px solid #444;display:flex;align-items:center;justify-content:center;font-size:72px}.precio{background:#fff;color:#000;padding:5px 10px;border-radius:14px;font-size:12px;font-weight:bold;display:inline-block}.desc{background:red;color:#fff;padding:4px 8px;border-radius:12px;font-size:11px;margin-left:5px;display:inline-block}</style></head><body>
<h1>Mi Tienda Web - 900 visibles 100%</h1>
<p style="color:#fff">Imagen del producto GRANDE - 100% visible</p>
<div class="grid" id="g"></div>
<br><a href="index.html" style="color:gold;border:1px solid gold;padding:12px 24px;border-radius:25px;text-decoration:none"> << Volver a Index </a>
<script>
let lista=[
{nom:"reloj",ico:"⌚"},{nom:"yogurt",ico:"🍶"},{nom:"leche",ico:"🥛"},{nom:"zapato",ico:"👟"},{nom:"pantalon",ico:"👖"},
{nom:"lentes",ico:"🕶️"},{nom:"gorra",ico:"🧢"},{nom:"bolsa",ico:"👜"},{nom:"collar",ico:"📿"},{nom:"anillo",ico:"💍"},
{nom:"telefono",ico:"📱"},{nom:"tablet",ico:"📲"},{nom:"computadora",ico:"💻"},{nom:"audifonos",ico:"🎧"},{nom:"reloj inteligente",ico:"⌚"},
{nom:"tenis",ico:"👟"},{nom:"playera",ico:"👕"},{nom:"mochila",ico:"🎒"}
];
let g=document.getElementById('g'); let html="";
for(let i=1;i<=900;i++){
let p=lista[i%lista.length];
let precio=(30+i*0.45).toFixed(2);
let d=Math.floor(Math.random()*50+5);
html+=`<div class="card"><div class="foto">${p.ico}</div><div style="color:#fff;font-size:13px;margin:5px 0">${p.nom} ${i}</div><span class="precio">s/ ${precio}</span><span class="desc">-${d}%</span></div>`;
}
g.innerHTML=html;
</script>
</body></html>
